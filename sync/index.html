<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in Edgeleaf</title>
    <meta name="robots" content="noindex" />
    <style>
      :root { --bg: #f5efe3; --ink: #221c16; --ink-2: #5d5245; --accent: #d6452a; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1d1916; --ink: #ebe1d1; --ink-2: #b6a792; --accent: #f0694a; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; text-align: center; }
      main { max-width: 26em; }
      h1 { margin: 0 0 8px; font: 400 30px/1.15 Georgia, "Iowan Old Style", serif; }
      p { margin: 0 0 18px; color: var(--ink-2); }
      a.open { display: inline-block; padding: 14px 26px; border-radius: 99px; background: var(--accent); color: #fff8f0; font-weight: 600; text-decoration: none; }
      .small { margin-top: 22px; font-size: 14px; }
      .small a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sync with your Mac</h1>
      <p>This phone is about to open Edgeleaf and swap your library with your computer, over your Wi-Fi.</p>
      <a class="open" id="open" href="#">Open in Edgeleaf</a>
      <p class="small">Don’t have Edgeleaf on this phone? <a href="../">Get it here</a>, then scan the code again.</p>
    </main>
    <script>
      // The code on the computer points here, with the sync offer after "#"
      // (that part never leaves the phone). Hand it to the app.
      const offer = location.hash.slice(1);
      const link = offer ? "edgeleaf://sync?" + offer : null;
      const button = document.getElementById("open");
      if (link) {
        button.href = link;
        setTimeout(() => (location.href = link), 300);
      } else button.remove();
    </script>
  </body>
</html>
